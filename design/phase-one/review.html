<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Fieldnotes · Design review</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080f0c;color:#e8eddd;font:13px/1.5 system-ui,sans-serif}.toolbar{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 24px;border-bottom:1px solid #334638;position:sticky;top:0;z-index:2;background:#14231e}.toolbar strong{font-weight:550}.toolbar small{color:#a5b6a7;display:block;font-size:10px}.modes{display:flex;gap:7px}button,a,select{color:inherit;font:inherit}button,select{border:1px solid #43593e;border-radius:4px;padding:8px 11px;background:#14231e;cursor:pointer}button[aria-pressed=true]{background:#c8ef9d;color:#17251a}.page-choice{font-size:10px;color:#a5b6a7;display:flex;gap:8px;align-items:center}.page-choice select{font-size:12px;color:#e8eddd;max-width:200px}.toolbar>a{font-size:11px;white-space:nowrap}.stage{padding:24px;display:flex;justify-content:center;min-height:calc(100dvh - 66px)}iframe{display:block;width:100%;height:calc(100dvh - 114px);border:1px solid #43593e;background:#101c19;border-radius:8px}.mobile iframe{width:390px;max-width:100%;height:844px}.mobile .stage{padding-bottom:36px}@media(max-width:850px){.toolbar{flex-wrap:wrap}.toolbar>div:first-child{flex-basis:100%}}@media(max-width:500px){.toolbar{padding:12px;gap:12px}.toolbar small{display:none}.page-choice select{max-width:160px}.toolbar>a{display:none}.stage{padding:12px}iframe{height:calc(100dvh - 140px)}}</style></head>
<body><header class="toolbar"><div><strong>FIELDNOTES / DESIGN REVIEW</strong><small>Independent local preview · phases 1–3</small></div><label class="page-choice" for="review-page">Page<select id="review-page"><option value="home">Today’s edition</option><option value="hints">Gentle hints</option><option value="search">Answer finder</option><option value="archive">Recorded archive</option><option value="guide">Field guide</option><option value="scoring">Rarity & score planner</option><option value="missing-answer">Missing-answer checks</option><option value="status">Update states</option></select></label><div class="modes" aria-label="Preview width"><button type="button" data-mode="desktop" aria-pressed="true">Desktop</button><button type="button" data-mode="mobile" aria-pressed="false">Mobile · 390px</button></div><a id="full-page" href="./" target="_blank" rel="noopener">Open full page ↗</a></header><main class="stage"><iframe title="Krillion Fieldnotes design preview" src="./"></iframe></main>
<script>
const pages={home:'./',hints:'./hints.html',search:'./search.html',archive:'./archive.html',guide:'./guide.html',scoring:'./scoring.html','missing-answer':'./missing-answer.html',practice:'./practice.html',status:'./status.html'};
const buttons=[...document.querySelectorAll('[data-mode]')],select=document.getElementById('review-page'),frame=document.querySelector('iframe'),full=document.getElementById('full-page'),params=new URLSearchParams(location.search);
function saveView(){const state=new URLSearchParams();if(select.value!=='home')state.set('page',select.value);if(document.body.classList.contains('mobile'))state.set('view','mobile');history.replaceState(null,'',location.pathname+(state.size?'?'+state:''));}
function setMode(mode){document.body.classList.toggle('mobile',mode==='mobile');buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));saveView();}
function setPage(){frame.src=pages[select.value]||pages.home;full.href=frame.src;saveView();}
select.value=Object.hasOwn(pages,params.get('page'))?params.get('page'):'home';if(params.get('view')==='mobile')document.body.classList.add('mobile');buttons.forEach(b=>b.setAttribute('aria-pressed',String(document.body.classList.contains('mobile')===(b.dataset.mode==='mobile'))));if(select.value!=='home')frame.src=pages[select.value];full.href=frame.src;
buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));select.addEventListener('change',setPage);
</script></body></html>
